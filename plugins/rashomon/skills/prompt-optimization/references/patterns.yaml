# Prompt Optimization Patterns
# Runtime decision rules for prompt analysis

patterns:
  # P1: Critical (Must Fix)

  - id: BP-001
    name: Negative Instructions
    severity: P1

    what_to_look_for: |
      Look for instructions telling the LLM what NOT to do:
      - "don't", "do not", "never"
      - "avoid", "without"
      - "refrain from", "exclude"

    why_problematic: |
      Naming a forbidden behavior can prime the same behavior while leaving the desired action unspecified. A prohibition alone also gives the model no executable target state to follow.

    improvement: |
      State the desired action or allowed state first. Preserve a narrow explicit prohibition when violation is an irreversible operational action, the caller cannot normally recover it, and a positive-only rewrite would blur the boundary. Pair it with the safe alternative and authorization condition.

  - id: BP-002
    name: Vague Instructions
    severity: P1

    what_to_look_for: |
      Record a BP-002 issue when missing specificity leaves a decision required by the intended outcome and plausible interpretations would materially change correctness, requested scope, downstream usability, or verification.

      Treat unspecified format, length, boundaries, tone, style, or success criteria as acceptable flexibility when their plausible interpretations satisfy the intended outcome equally well.

    why_problematic: |
      Vague instructions delegate a required decision to the model without supplying observable criteria or a deterministic decision rule.

    improvement: |
      For each BP-002 finding:
      - Check supplied and project context for a source that determines the required decision
      - Choose one clarification that resolves the required decision
      - Prefer the least-restrictive sufficient criterion: the criterion that supplies the required precision while excluding the fewest valid solutions
      - Record its precision contribution: the observable output difference it improves for the intended outcome
      - Record its constraint cost: the valid solutions allowed by the original intent that it excludes
      - Apply it when the precision contribution is identifiable and the constraint cost preserves the original intent
      - Record the required source under unresolved inputs when supplied and project context cannot determine a decision that blocks faithful execution

  - id: BP-003
    name: Missing Output Format
    severity: P1

    what_to_look_for: |
      Check if the prompt specifies:
      - The structure required by the output consumer
      - Required fields, sections, hierarchy, or ordering
      - Required serialization or presentation form

    why_problematic: |
      Without the output shape needed by the consumer, results can be difficult to parse, route, compare, or verify.

    improvement: |
      Define only the output shape required for parsing, routing, comparison, or verification. Use the consumer's required structure and representation rather than selecting a format by convention.

  # P2: High Impact (Should Fix)

  - id: BP-004
    name: Unstructured Prompt
    severity: P2

    what_to_look_for: |
      Look for prompts that are:
      - One continuous block of text
      - Missing visible boundaries between distinct instruction roles
      - Multiple topics mixed without organization

    why_problematic: |
      Hidden priority and relationships make it easier to merge separate requirements or execute dependent actions out of order.

    improvement: |
      Introduce the smallest structure that makes instruction roles, priority, and dependencies visible. Choose labels and representation that fit the target medium and output consumer.

    conditional_application: |
      Apply IF:
      - Prompt longer than 3 sentences
      - Contains multiple distinct instructions
      - Has implicit section boundaries

      Skip when:
      - Single simple instruction
      - Already clearly structured
      - Structure would add unnecessary verbosity

  - id: BP-005
    name: Missing or Excess Context
    severity: P2

    what_to_look_for: |
      Check whether each decision, action, and verification has the context it needs. Also check for duplicated, distracting, or unactionable context that has no downstream effect.

    why_problematic: |
      Missing context forces assumptions. Excess context competes with operative instructions and makes required evidence harder to retrieve.

    improvement: |
      Build necessary and sufficient context:
      - Add an item when removing it would change a decision, action, or verification
      - Name the source for project-specific facts
      - Condense repeated facts into one operative statement
      - Keep raw background behind a path or reference when only an extracted fact is needed

  - id: BP-006
    name: Missing Procedural Gates
    severity: P2

    what_to_look_for: |
      Look for prompts with:
      - 3+ distinct objectives in one instruction
      - Sequential dependencies not made explicit
      - No intermediate checkpoints
      - Multiple dependent actions presented as one step

    why_problematic: |
      Without intermediate evidence and transition conditions, a model can jump to a later result while silently skipping prerequisite analysis.

    improvement: |
      Break dependent work into ordered steps. Each step names its output evidence and the condition that permits the next step.

    key_insight: |
      The goal is externally visible state progression: each step produces evidence that controls whether the next step is valid.

  # P3: Enhancement (Could Fix)

  - id: BP-007
    name: Unnecessary or Biased Examples
    severity: P3

    what_to_look_for: |
      First determine whether examples communicate information unavailable from a concise rule or consumer-required output shape. When examples are necessary, check for irrelevant surface patterns, unbalanced cases, missing exceptions, and repeated examples that remove the same ambiguity.

    why_problematic: |
      Examples condition output distribution, format, and local patterns. Generic or redundant examples consume context and can anchor the response to details unrelated to the target task.

    improvement: |
      Default to a concise rule or consumer-required output shape for generally known behavior. Add an example only for a domain-, product-, or organization-specific mapping, a non-obvious exception, or a boundary that a rule cannot express. Map each example to the ambiguity it removes and retain the smallest covering set.

  - id: BP-008
    name: Missing Uncertainty Handling
    severity: P3

    what_to_look_for: |
      Check if the prompt:
      - Demands an answer regardless of confidence
      - Has no instruction for handling ambiguity
      - Implicitly requires certainty

    why_problematic: |
      Without an evidence threshold and next action, the model must choose between guessing, stopping without useful information, or proceeding on an unstated assumption.

    improvement: |
      Define uncertainty handling as an operational rule:

      "Classify claims as observed, inferred, or unknown. For unknown inputs that block the next step, stop at the current gate and name the exact evidence or user decision required to continue."
