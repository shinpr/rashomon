# Prompt Optimization Patterns
# Runtime decision rules for prompt analysis

patterns:
  # P1: Critical (Must Fix)

  - id: BP-001
    name: Negative Instructions
    severity: P1

    what_to_look_for: |
      Look for instructions telling the LLM what NOT to do:
      - "don't", "do not", "never"
      - "avoid", "without"
      - "refrain from", "exclude"

      Examples:
      - "Don't include personal opinions"
      - "Avoid technical jargon"
      - "Never use bullet points"

    why_problematic: |
      Naming a forbidden behavior can prime the same behavior while leaving the desired action unspecified. A prohibition alone also gives the model no executable target state to follow.

    improvement: |
      State the desired action or allowed state first. Preserve a narrow explicit prohibition when violation is an irreversible operational action, the caller cannot normally recover it, and a positive-only rewrite would blur the boundary. Pair it with the safe alternative and authorization condition.

      Examples:
      - "Don't include opinions" -> "Include only factual, verifiable information"
      - "Avoid jargon" -> "Use plain language accessible to general audience"
      - "Never use bullet points" -> "Use numbered lists or prose paragraphs"

    examples:
      bad:
        - "Don't make the code too complex"
        - "Avoid using deprecated APIs"
        - "Don't forget error handling"
      good:
        - "Write simple, readable code with clear variable names"
        - "Use only current, supported APIs from the latest documentation"
        - "Include comprehensive error handling for all failure cases"
        - "Keep repository history unchanged. Do not commit or push until the user explicitly requests it."

  - id: BP-002
    name: Vague Instructions
    severity: P1

    what_to_look_for: |
      Look for prompts lacking specificity in:
      - Output format (JSON? Markdown? Plain text?)
      - Length/scope ("summarize" without word count)
      - Boundaries (what to include/exclude)
      - Tone/style (formal? casual? technical?)
      - Success criteria (how to know if done correctly)

    why_problematic: |
      Vague instructions delegate a required decision to the model without supplying observable criteria or a deterministic decision rule.

    improvement: |
      Add explicit constraints for all ambiguous aspects:

      - Format: "Output as JSON with keys: name, description, priority"
      - Length: "Maximum 200 words" or "3-5 bullet points"
      - Scope: "Focus only on authentication, exclude authorization"
      - Tone: "Professional tone suitable for technical documentation"

    examples:
      bad:
        - "Summarize this article"
        - "Write some code for this"
        - "Explain the concept"
      good:
        - "Summarize this article in 3 bullet points, max 50 words each"
        - "Write a Python function with type hints and docstring"
        - "Explain the concept in 2 paragraphs for a junior developer audience"

  - id: BP-003
    name: Missing Output Format
    severity: P1

    what_to_look_for: |
      Check if the prompt specifies:
      - Expected structure (sections, fields, hierarchy)
      - Data format (JSON, YAML, Markdown, etc.)
      - Example of desired output

    why_problematic: |
      Without the output shape needed by the consumer, results can be difficult to parse, route, compare, or verify.

    improvement: |
      Explicitly define output format:

      - For data: Provide JSON schema or example
      - For prose: Specify section headers
      - For lists: Indicate numbering style and item format

      Example addition:
      "Output format:
      ```json
      {
        \"summary\": \"...\",
        \"key_points\": [\"...\"],
        \"recommendation\": \"...\"
      }
      ```"

    examples:
      bad:
        - "Analyze this code and give feedback"
        - "List the pros and cons"
      good:
        - |
          Analyze this code and provide feedback in this format:
          ## Issues Found
          - [severity] description
          ## Suggestions
          - suggestion with code example
        - |
          List pros and cons as:
          | Aspect | Pros | Cons |
          |--------|------|------|

  # P2: High Impact (Should Fix)

  - id: BP-004
    name: Unstructured Prompt
    severity: P2

    what_to_look_for: |
      Look for prompts that are:
      - One continuous block of text
      - No section headers or separators
      - No Markdown formatting
      - Multiple topics mixed without organization

    why_problematic: |
      Hidden priority and relationships make it easier to merge separate requirements or execute dependent actions out of order.

    improvement: |
      Apply the 4-block pattern:

      ## Context
      [Background, purpose, audience]

      ## Task
      [What to accomplish]

      ## Constraints
      [Limitations, requirements, boundaries]

      ## Output Format
      [Expected structure of response]

    conditional_application: |
      Apply IF:
      - Prompt longer than 3 sentences
      - Contains multiple distinct instructions
      - Has implicit section boundaries

      Skip when:
      - Single simple instruction
      - Already clearly structured
      - Structure would add unnecessary verbosity

    examples:
      bad:
        - "I need you to write a function that sorts an array and it should handle edge cases like empty arrays and arrays with one element and also it should be efficient and work with both numbers and strings and output should include the function and some test cases"
      good:
        - |
          ## Context
          Building a utility library for array operations.

          ## Task
          Write a sort function for arrays.

          ## Constraints
          - Handle edge cases: empty arrays, single element
          - Support both numbers and strings
          - Optimize for performance

          ## Output Format
          - Function with docstring
          - 3 test cases demonstrating edge cases

  - id: BP-005
    name: Missing or Excess Context
    severity: P2

    what_to_look_for: |
      Check whether each decision, action, and verification has the context it needs. Also check for duplicated, distracting, or unactionable context that has no downstream effect.

    why_problematic: |
      Missing context forces assumptions. Excess context competes with operative instructions and makes required evidence harder to retrieve.

    improvement: |
      Build necessary and sufficient context:
      - Add an item when removing it would change a decision, action, or verification
      - Name the source for project-specific facts
      - Condense repeated facts into one operative statement
      - Keep raw background behind a path or reference when only an extracted fact is needed

    examples:
      bad:
        - "Write a login function"
      good:
        - |
          ## Context
          This login endpoint belongs to the mobile banking API. Reuse the existing JWT issuer and rate-limiting middleware at the named project paths.

          ## Task
          Write a login function that validates credentials and returns a token.

  - id: BP-006
    name: Missing Procedural Gates
    severity: P2

    what_to_look_for: |
      Look for prompts with:
      - 3+ distinct objectives in one instruction
      - Sequential dependencies not made explicit
      - No intermediate checkpoints
      - Multiple verbs for different actions (analyze AND implement AND test)

    why_problematic: |
      Without intermediate evidence and transition conditions, a model can jump to a later result while silently skipping prerequisite analysis.

    improvement: |
      Break into evaluable steps with completion evidence and transition rules:

      Instead of: "Analyze, implement, and test the feature"

      Use:
      "Step 1: Analyze requirements and list acceptance criteria
       [gate: proceed only when every requirement maps to an acceptance criterion]
       Step 2: Implement the feature
       [gate: proceed only when implementation evidence covers every criterion]
       Step 3: Write tests for each criterion"

    key_insight: |
      The goal is externally visible state progression: each step produces evidence that controls whether the next step is valid.

    examples:
      bad:
        - "Build a user authentication system with registration, login, password reset, and session management"
      good:
        - |
          Build user authentication in these steps:

          1. Design the data model
             Evidence: Map every required field to a schema property.
             Transition: Continue only when the mapping has no gaps.

          2. Implement registration endpoint
             Evidence: Tests pass for valid and invalid inputs.
             Transition: Continue only when each acceptance criterion has a passing test.

          3. Implement login endpoint
             Evidence: A valid login produces a verified token.
             Transition: Continue only when token generation and verification both pass.

          4. Implement password reset flow
             Evidence: Email delivery and reset-token validation tests pass.
             Failure rule: Stop and report the failing prerequisite instead of claiming completion.

  # P3: Enhancement (Could Fix)

  - id: BP-007
    name: Unnecessary or Biased Examples
    severity: P3

    what_to_look_for: |
      First determine whether examples communicate information unavailable from a concise instruction or schema. When examples are necessary, check for irrelevant surface patterns, unbalanced cases, missing exceptions, and repeated examples that remove the same ambiguity.

    why_problematic: |
      Examples condition output distribution, format, and local patterns. Generic or redundant examples consume context and can anchor the response to details unrelated to the target task.

    improvement: |
      Default to an instruction or schema for generally known behavior. Add an example only for a domain-, product-, or organization-specific mapping, a non-obvious exception, or a boundary that a schema cannot express. Map each example to the ambiguity it removes and retain the smallest covering set.

    examples:
      bad:
        - |
          Examples of good commit messages:
          - "Add user authentication"
          - "Add payment processing"
          - "Add email notifications"
      good:
        - |
          Organization-specific mapping not available from general knowledge:
          - Input: backward-compatible public API fix
            Output prefix: "fix"
          - Input: breaking public API change
            Output prefix: "breaking"
          These examples define the organization's non-standard release mapping.

  - id: BP-008
    name: Missing Uncertainty Handling
    severity: P3

    what_to_look_for: |
      Check if the prompt:
      - Demands an answer regardless of confidence
      - Has no instruction for handling ambiguity
      - Implicitly requires certainty

    why_problematic: |
      Without an evidence threshold and next action, the model must choose between guessing, stopping without useful information, or proceeding on an unstated assumption.

    improvement: |
      Define uncertainty handling as an operational rule:

      "Classify claims as observed, inferred, or unknown. For unknown inputs that block the next step, stop at the current gate and name the exact evidence or user decision required to continue."

    examples:
      bad:
        - "What is the exact cause of this bug?"
      good:
        - "List candidate causes as observed, inferred, or unknown. Proceed to a fix only when one cause is supported by a reproducer or trace; otherwise return the evidence needed for the next diagnostic step."
