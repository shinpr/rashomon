# Execution Quality Evaluation Criteria
# Used in Step 3 (Balance Adjustment) of the optimization flow

evaluation_criteria:

  # Improvement Classification

  improvement_types:
    structural:
      description: |
        Essential changes to accuracy, completeness, or structure of output. These indicate genuine optimization benefit.
      indicators:
        - Output addresses requirements that were missed before
        - Fewer errors or inaccuracies
        - Better organized or more complete response
        - Clearer logic or reasoning
      weight: high

    context_addition:
      description: |
        Project-specific information added from codebase investigation, not from prompt rewriting. Indicates information advantage rather than prompt writing technique.
      indicators:
        - Codebase-derived context injected into prompt
        - Domain-specific terms or constraints added from project knowledge
        - File paths, API signatures, or architecture details included
      weight: high
      note: "Distinguish from structural: context addition is about what information was added, structural is about how the prompt was written."

    expressive:
      description: |
        Different phrasing, ordering, or presentation, but equivalent substance. Neutral classification requiring context to evaluate.
      indicators:
        - Same information presented differently
        - Different word choices with same meaning
        - Reordered sections with same content
      weight: medium

    variance:
      description: |
        Within the probabilistic variance range of LLM output ("jitter"). If only variance-level differences exist, the original prompt was sufficient.
      indicators:
        - Minor wording differences
        - Slightly different examples (but equivalent quality)
        - Different formatting choices (when not specified)
      weight: ignore

  # Gated balance checks for Step 3

  balance_checks:

    intent_preservation:
      description: Verify every original requirement remains represented with the same meaning
      pass_evidence:
        - Each preservation requirement maps to text in the candidate prompt
        - Any intentional semantic change is identified as unresolved rather than silently applied
      blocked_when:
        - A requirement has no mapping
        - A rewrite narrows or expands user intent without source support

    decision_sufficiency:
      description: Verify each required decision, action, and check has enough input to execute
      pass_evidence:
        - Every delegated choice has an explicit selection or deterministic decision rule
        - Every ordered step names the evidence that permits the next transition
      blocked_when:
        - The model must guess a project, product, security, or compatibility decision
        - A later step can begin without evidence from its prerequisite

    information_density:
      description: Verify context is necessary, condensed, and placed near the decision it controls
      pass_evidence:
        - Each context item names its downstream decision, action, or verification use
        - Repeated facts are consolidated
        - Raw background is replaced by an extracted fact and source path when sufficient
      blocked_when:
        - Removing a context item would not change any downstream behavior
        - Required evidence is obscured by unrelated detail

    constraint_necessity:
      description: Verify each constraint resolves ambiguity or protects a real requirement
      pass_evidence:
        - Each constraint traces to a finding, preservation requirement, or project source
        - Simple tasks retain lightweight instructions
      blocked_when:
        - A constraint limits a valid solution without protecting a named requirement
        - Structure or formatting exists only for visual regularity

    traceability:
      description: Verify factual additions and changes have inspectable origins
      pass_evidence:
        - Each change maps to a finding or named project source
        - Claims are distinguishable as observed, inferred, or unknown when evidence differs
      blocked_when:
        - Project-specific context has no source
        - An inference is presented as an observed fact

  # Comparison Evaluation

  comparison_criteria:

    effectiveness:
      question: "Did the optimization lead to a better outcome?"
      evaluation:
        - Compare actual outputs, not just prompt structure
        - Focus on task completion quality
        - Consider edge case handling
      scoring:
        much_better: "Clear structural improvement in output"
        somewhat_better: "Minor improvements visible"
        equivalent: "No meaningful difference (variance-level)"
        worse: "Original output was actually better"

    efficiency:
      question: "Was the optimization cost-effective?"
      evaluation:
        - Prompt complexity vs output improvement
        - Time/token cost of longer prompts
        - Maintenance burden of complex prompts
      note: "Additional prompt content must produce an attributable execution benefit"

    applicability:
      question: "Is this improvement generalizable?"
      evaluation:
        - Would this improvement help similar prompts?
        - Is it project-specific or universal?
        - Should it be added to knowledge base?

  # Knowledge Extraction Criteria

  knowledge_extraction:

    save_as_pattern:
      conditions:
        - Optimized prompt showed clear structural improvement
        - Improvement is project-specific (not explained by BP-001~008)
        - Pattern is likely to recur in this project
      confidence_guidance:
        "0.8+": "Multiple comparisons confirmed same pattern"
        "0.5-0.7": "Single comparison showed clear effect"
        "<0.5": "Effect present but uncertain; consider not saving"

    save_as_anti_pattern:
      conditions:
        - Original prompt had a problem specific to this project
        - Problem is not covered by standard patterns (BP-001~008)
        - Problem is likely to recur

    do_not_save:
      conditions:
        - Improvement explained by standard best practices
        - One-time special case (no recurrence expected)
        - Effect was unclear or variance-level
        - Generic advice without project-specific insight

  # Report Generation Guidance

  report_sections:

    executive_summary:
      focus: "Was there meaningful improvement?"
      include:
        - Overall assessment (structural/context addition/expressive/variance)
        - Key learning if any
        - Recommendation for prompt usage

    comparison_analysis:
      focus: "What specifically changed and why?"
      include:
        - Side-by-side of key differences
        - Classification of each difference type
        - Observed association between a change and repeatable output differences
        - Causal hypotheses only when a change-to-output mapping repeats across paired trials

    learning_points:
      focus: "What can be learned from this comparison?"
      include:
        - Confirmed effective patterns
        - Patterns that had no effect
        - Project-specific insights
        - Recommendations for future prompts
